name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

# A new push cancels the run still going for the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, as tags can be moved
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm (version from packageManager), Node.js and the
      # dependencies with `pnpm install --frozen-lockfile`
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: pnpm format:check
      - run: pnpm test:run
      # Includes the type check of the library, demo app and tests
      - run: pnpm build
