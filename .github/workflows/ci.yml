name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

# A new push cancels the run still going for the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from packageManager), Node.js and the
      # dependencies with `pnpm install --frozen-lockfile`
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: pnpm format:check
      - run: pnpm test:run
      # Includes the type check of the library, demo app and tests
      - run: pnpm build
